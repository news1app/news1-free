name: Update NEWS1 Free Data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron memakai UTC. Ini berjalan setiap jam pada menit 17.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: news1-free-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate NEWS1 Free JSON
        run: python scripts/build_news1_free.py

      - name: Validate JSON
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/history.json > /dev/null

      - name: Commit fresh data
        run: |
          git config user.name "news1-free-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "data: update NEWS1 Free"
          git push

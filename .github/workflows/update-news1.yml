name: Update NEWS1 Free Data

on:
  workflow_dispatch:
  schedule:
    # UTC. Menit 17 dan 47 = kira-kira setiap 30 menit.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: news1-free-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate NEWS1 Free V2 JSON
        run: python scripts/build_news1_free.py

      - name: Validate JSON
        run: |
          python -m json.tool data/latest.json > /dev/null
          python -m json.tool data/history.json > /dev/null

      - name: Commit fresh data safely
        shell: bash
        run: |
          git config user.name "news1-free-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "data: update NEWS1 Free V2"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
